<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#030914" />

    <!-- SEO: edite título e descrição aqui (e em src/config/site.ts para o conteúdo da página) -->
    <title>Creator X | Desenvolvimento de sites e soluções digitais</title>
    <meta
      name="description"
      content="A Creator X cria sites modernos, estratégicos e personalizados: sites institucionais, landing pages, lojas virtuais e soluções digitais sob medida."
    />
    <meta name="robots" content="index, follow" />
    <!-- Quando tiver o domínio definitivo, descomente e ajuste: -->
    <!-- <link rel="canonical" href="https://www.seudominio.com.br/" /> -->

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Creator X" />
    <meta property="og:title" content="Creator X | Transformamos ideias em experiências digitais" />
    <meta
      property="og:description"
      content="Sites modernos, estratégicos e personalizados para transformar sua presença digital."
    />
    <!-- Para redes sociais, o ideal é URL absoluta. Ajuste após definir o domínio. -->
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Favicon baseado na logo oficial -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <noscript>Ative o JavaScript para visualizar o site da Creator X.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
